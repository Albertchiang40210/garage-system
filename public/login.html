<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車庫小籠包 - 員工登入</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
        <div class="text-center mb-8">
            <span class="text-4xl block mb-2">🥟</span>
            <h1 class="text-2xl font-black text-slate-800">車庫小籠包系統</h1>
            <p class="text-sm text-slate-500 font-bold mt-1">請登入以繼續操作</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">帳號 Username</label>
                <input type="text" id="username" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all font-bold" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">密碼 Password</label>
                <input type="password" id="password" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all font-bold" required>
            </div>
            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-black py-3 rounded-lg shadow-md transition-all mt-4">
                安全登入
            </button>
            <p id="error-msg" class="text-red-500 text-sm font-bold text-center hidden mt-2"></p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    localStorage.setItem('garage_token', data.token);
                    localStorage.setItem('garage_role', data.role);
                    // Redirect to dashboard
                    window.location.href = '/dashboard.html';
                } else {
                    const msg = document.getElementById('error-msg');
                    msg.innerText = "❌ " + data.error;
                    msg.classList.remove('hidden');
                }
            })
            .catch(err => console.error(err));
        });
    </script>
</body>
</html>
